name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel'}
          - {os: ubuntu-latest, r: 'devel'}
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::rcmdcheck
            any::remotes
            any::svglite

      - name: Install package (required for self-test)
        run: |
          Rscript -e 'remotes::install_local(".", force = TRUE, quiet = TRUE)'

      - name: Run self-test
        run: |
          Rscript -e 'library(Rclade); exit_code <- run_rclade_selftest(); quit(status = exit_code)'

      - name: Check
        uses: r-lib/actions/check-r-package@v2

      - name: Run pure unit suite (stage A, no external deps)
        run: |
          Rscript scripts/ci_pure_unit.R

      - name: Run functional smoke tests
        run: |
          Rscript tests/functional/run-functional-smoke.R

      - name: Run performance regression tests
        run: |
          Rscript -e 'library(testthat); test_file("tests/testthat/test-performance.R", reporter = "summary")'

  # Dependency-resolution smoke job (v1.1.0, reviewer issue 7): verifies the
  # package installs and the pure unit suite passes with the dependency set
  # resolved from CURRENT releases.  This job does NOT verify the version
  # lower bounds declared in DESCRIPTION: Bioconductor packages (ggtree,
  # tidytree, treeio) cannot be version-pinned through BiocManager, and
  # pinning ggplot2/deeptime at their declared lower bounds creates
  # unsatisfiable transitive conflicts with current Bioconductor releases.
  # Manuscript claims must therefore describe CI verification as
  # "current-release" rather than "lower-bound".
  deps-smoke:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install dependencies (current resolvable set)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::rcmdcheck
            any::remotes
          # NOTE: We do NOT pin ggplot2/deeptime/stringr/ape here because
          # Bioconductor packages (ggtree, tidytree) are installed at their
          # current release versions and require newer transitive deps.
          # Pinning those would create unsatisfiable dependency conflicts.
          # Consequently the DESCRIPTION lower bounds are NOT exercised by
          # this job; they are only enforced at install time.

      - name: Report installed versions
        run: |
          Rscript -e 'ip <- installed.packages(); print(ip[c("ggplot2","deeptime","stringr","ape","ggtree","tidytree"), "Version"])'

      - name: Install package
        run: |
          Rscript -e 'remotes::install_local(".", force = TRUE, quiet = TRUE)'

      - name: Run pure unit suite against resolved versions
        run: |
          Rscript scripts/ci_pure_unit.R

  coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            any::remotes

      - name: Install package (required for coverage)
        run: |
          Rscript -e 'remotes::install_local(".", force = TRUE, quiet = TRUE)'

      - name: Run coverage
        run: |
          # Coverage is computed for monitoring only (v1.1.0, reviewer issue 7):
          # the 85% targets in codecov.yml are informational and are NOT
          # enforced as a required check by this workflow.
          Rscript -e 'covr::package_coverage(type = c("tests", "examples"), quiet = FALSE)'

      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          # Best-effort upload: no CODECOV_TOKEN is configured, so tokenless
          # uploads may be rejected by Codecov. An upload failure must NOT
          # fail the workflow; consequently coverage is not a CI quality gate.
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
