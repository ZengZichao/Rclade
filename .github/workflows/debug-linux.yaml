name: debug-linux

# Temporary bisect workflow to locate the glibc "stack smashing detected"
# crash in the adversarial-input tests. Runs each statement in a separate
# Rscript process and reports exit codes. Safe to delete once fixed.

on:
  workflow_dispatch:
  push:
    branches: [debug-linux]

jobs:
  bisect:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check

      - name: Bisect adversarial tests one process per statement
        run: |
          set +e
          run_snippet() {
            name="$1"; snippet="$2"
            cat > /tmp/snip.R <<EOF
          suppressPackageStartupMessages(library(Rclade))
          set_log_level("ERROR")
          $snippet
          cat("SNIPPET OK\n")
          EOF
            Rscript /tmp/snip.R > /tmp/snip.out 2>&1
            code=$?
            echo "=== $name -> exit $code ==="
            tail -5 /tmp/snip.out
          }

          run_snippet "ape-version" 'cat(as.character(packageVersion("ape")), as.character(getRversion()), "\n")'
          run_snippet "len-1000" 'tree <- ape::read.tree(text=paste0("(", paste0(rep("A",1000), collapse=""), ":1,B:1):1;")); cat("len-1000 ok\n")'
          run_snippet "len-2000" 'tree <- ape::read.tree(text=paste0("(", paste0(rep("A",2000), collapse=""), ":1,B:1):1;")); cat("len-2000 ok\n")'
          run_snippet "len-4000" 'tree <- ape::read.tree(text=paste0("(", paste0(rep("A",4000), collapse=""), ":1,B:1):1;")); cat("len-4000 ok\n")'
          run_snippet "len-8000" 'tree <- ape::read.tree(text=paste0("(", paste0(rep("A",8000), collapse=""), ":1,B:1):1;")); cat("len-8000 ok\n")'
          run_snippet "len-10000" 'tree <- ape::read.tree(text=paste0("(", paste0(rep("A",10000), collapse=""), ":1,B:1):1;")); cat("len-10000 ok\n")'
          run_snippet "read-tree-file" 'long_label <- paste0(rep("A", 10000), collapse=""); f <- tempfile(fileext=".nwk"); writeLines(paste0("(", long_label, ":1,B:1):1;"), f); tree <- ape::read.tree(f); cat("file ok\n")'
        shell: bash
