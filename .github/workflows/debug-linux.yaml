name: debug-linux

# Temporary bisect workflow to locate the glibc "stack smashing detected"
# crash in the adversarial-input tests. Runs each statement in a separate
# Rscript process and reports exit codes. Safe to delete once fixed.

on:
  workflow_dispatch:
  push:
    branches: [debug-linux]

jobs:
  bisect:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check

      - name: Bisect adversarial tests one process per statement
        run: |
          set +e
          run_snippet() {
            name="$1"; snippet="$2"
            cat > /tmp/snip.R <<EOF
          suppressPackageStartupMessages(library(Rclade))
          set_log_level("ERROR")
          $snippet
          cat("SNIPPET OK\n")
          EOF
            Rscript /tmp/snip.R > /tmp/snip.out 2>&1
            code=$?
            echo "=== $name -> exit $code ==="
            tail -5 /tmp/snip.out
          }

          run_snippet "ctrl-plain" 'tryCatch(Rclade:::validate_newick_syntax("(A\x01:1,B:1):1;", "test"), error = function(e) cat("caught:", conditionMessage(e), "\n"))'
          run_snippet "bidi-plain" 'tryCatch(Rclade:::validate_newick_syntax("(A\u202E:1,B:1):1;", "test"), error = function(e) cat("caught:", conditionMessage(e), "\n"))'
          run_snippet "ctrl-expect_error" 'expect_error(Rclade:::validate_newick_syntax("(A\x01:1,B:1):1;", "test")); cat("expect_error ok\n")'
          run_snippet "bidi-expect_error" 'expect_error(Rclade:::validate_newick_syntax("(A\u202E:1,B:1):1;", "test")); cat("expect_error ok\n")'
          run_snippet "cycle" 'df <- data.frame(domain=c("A","B"), phylum=c("B","A"), stringsAsFactors=FALSE); expect_error(Rclade:::validate_taxonomy_no_cycles(df, "test"), "Circular"); cat("cycle ok\n")'
          run_snippet "longlabel" 'long_label <- paste0(rep("A", 10000), collapse=""); txt <- paste0("(", long_label, ":1,B:1):1;"); tree <- ape::read.tree(text=txt); expect_s3_class(plot_timetree(tree, rank="none", add_timescale=FALSE), "ggplot"); cat("longlabel ok\n")'
        shell: bash
