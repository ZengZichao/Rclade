name: debug-linux

# Temporary bisect workflow to locate the glibc "stack smashing detected"
# crash in the adversarial-input tests. Runs each statement in a separate
# Rscript process and reports exit codes. Safe to delete once fixed.

on:
  workflow_dispatch:
  push:
    branches: [debug-linux]

jobs:
  bisect:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check

      - name: Bisect adversarial tests one process per statement
        run: |
          set +e
          run_snippet() {
            name="$1"; snippet="$2"
            cat > /tmp/snip.R <<EOF
          suppressPackageStartupMessages(library(Rclade))
          set_log_level("ERROR")
          $snippet
          cat("SNIPPET OK\n")
          EOF
            Rscript /tmp/snip.R > /tmp/snip.out 2>&1
            code=$?
            echo "=== $name -> exit $code ==="
            tail -5 /tmp/snip.out
          }

          for L in 100 200 300 400 500 600 800; do
            run_snippet "len-$L" "tree <- ape::read.tree(text=paste0('(', paste0(rep('A',$L), collapse=''), ':1,B:1):1;')); cat('len-$L ok\n')"
          done
          Rscript -e 'cat("ape", as.character(packageVersion("ape")), "R", as.character(getRversion()), "\n")'
        shell: bash
