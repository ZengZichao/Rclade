name: debug-linux

# Temporary bisect workflow to locate the glibc "stack smashing detected"
# crash in the adversarial-input tests. Runs each statement in a separate
# Rscript process and reports exit codes. Safe to delete once fixed.

on:
  workflow_dispatch:
  push:
    branches: [debug-linux]

jobs:
  bisect:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check

      - name: Bisect adversarial tests one process per statement
        run: |
          set +e
          run_snippet() {
            name="$1"; snippet="$2"
            cat > /tmp/snip.R <<EOF
          suppressPackageStartupMessages(library(Rclade))
          set_log_level("ERROR")
          $snippet
          cat("SNIPPET OK\n")
          EOF
            Rscript /tmp/snip.R > /tmp/snip.out 2>&1
            code=$?
            echo "=== $name -> exit $code ==="
            tail -5 /tmp/snip.out
          }

          long_setup='long_label <- paste0(rep("A", 10000), collapse=""); txt <- paste0("(", long_label, ":1,B:1):1;"); tree <- ape::read.tree(text=txt)'
          run_snippet "read-tree" "$long_setup; cat("read-tree ok\n")"
          run_snippet "parse-tax" "$long_setup; taxa <- parse_taxonomy_with_file(tree$tip.label, "phylum"); cat("parse-tax ok\n")"
          run_snippet "ggtree-basic" 'tree <- ape::read.tree(text="(AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA:1,B:1):1;"); print(class(ggtree::ggtree(tree))); cat("ggtree-basic ok\n")'
          run_snippet "ggtree-long" "$long_setup; print(class(suppressWarnings(ggtree::ggtree(tree)))); cat("ggtree-long ok\n")"
          run_snippet "plot-none-rank" "$long_setup; p <- plot_timetree(tree, rank="none", add_timescale=FALSE); cat("plot-none ok\n")"
          run_snippet "ggsave-long" "$long_setup; p <- suppressWarnings(ggplot2::ggplot()); ggplot2::ggsave("/tmp/x.pdf", p); f <- tempfile(fileext=".pdf"); ggsave(f, plot_timetree(tree, rank="none", add_timescale=FALSE)); cat("ggsave ok\n")'
        shell: bash
