name: macOS 26 compatibility probe

# Non-blocking probe, deliberately isolated from the required R-CMD-check
# workflow. It runs on a weekly schedule (and on manual dispatch) because
# macos-26 runners are not always available: a queued job that GitHub cancels
# would otherwise mark a required check red.
#
# History: until 2026-09-15 the macos-latest (= macos-26-arm64) matrix job was
# green on R 4.6.1; from late September 2026 install_local started failing
# within seconds on the refreshed macos-26 runner image, with the real error
# hidden by quiet = TRUE. The main matrix is pinned to macos-15 (last
# known-good image) so CI stays actionable. Once the root cause is fixed
# upstream or in this repo, move the matrix back to macos-latest and drop
# this workflow.

on:
  schedule:
    - cron: '30 6 * * 1' # Mondays 06:30 UTC
  workflow_dispatch:

jobs:
  macos-26-compat:
    runs-on: macos-26
    continue-on-error: true

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - name: Install XQuartz (gdtools needs /opt/X11)
        run: brew install --cask xquartz

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::rcmdcheck
            any::remotes
            any::svglite

      - name: Install package (verbose, for root-cause diagnosis)
        run: |
          Rscript -e 'remotes::install_local(".", force = TRUE)'

      - name: Run self-test
        run: |
          Rscript -e 'library(Rclade); exit_code <- run_rclade_selftest(); quit(status = exit_code)'
