name: Feature request / 功能建议
description: 为 Rclade 提出新功能或改进建议。Propose a new feature or improvement for Rclade.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出建议！Rclade 的定位是"单函数、自动化、可复现的深层时间树折叠与可视化"，建议时请尽量贴合该定位与 CRAN 包的维护约束。
        Suggestions are welcome! Rclade aims at a single-function, automated, reproducible collapsing & visualization pipeline for deep-time trees — please keep that scope (and CRAN constraints) in mind.
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 你当前的工作流遇到了什么困难？What limitation are you hitting in your current workflow?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案 / Proposed solution
      description: 期望的接口或行为，可附示例代码。Desired interface/behavior, with example code if possible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案与参考 / Alternatives & references
      description: 已尝试的替代做法、相关文献或软件。Workarounds tried, related papers or software.
